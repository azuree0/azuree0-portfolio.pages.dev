name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  WASM_BINDGEN_CLI_VERSION: "0.2.108"
  TRUNK_VERSION: "0.21.14"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "portfolio"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache ~/.cargo/bin (wasm-bindgen-cli)
        uses: actions/cache@v4
        id: cache-cargo-bin
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-cargo-bin-wasm-bindgen-${{ env.WASM_BINDGEN_CLI_VERSION }}-v2

      - name: Install Trunk (prebuilt)
        run: |
          set -e
          curl -sSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv trunk /usr/local/bin/
          trunk --version

      - name: Install wasm-bindgen-cli (cargo-binstall or cache)
        run: |
          set -e
          export PATH="$HOME/.cargo/bin:$PATH"
          if [ -x "$HOME/.cargo/bin/wasm-bindgen" ]; then
            echo "Using cached wasm-bindgen-cli"
            wasm-bindgen --version
            exit 0
          fi
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo binstall wasm-bindgen-cli --version "${WASM_BINDGEN_CLI_VERSION}" --no-confirm \
            || cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_CLI_VERSION}" --locked
          wasm-bindgen --version

      - name: Build
        run: trunk build --release --public-url /

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
