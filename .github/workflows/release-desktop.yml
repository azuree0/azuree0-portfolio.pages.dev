# Build Electron installers from Trunk/Yew and upload to a draft GitHub Release.
# Trigger: git tag v* && git push origin v*

name: Release Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  WASM_BINDGEN_CLI_VERSION: "0.2.108"
  TRUNK_VERSION: "0.21.14"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            trunk_asset: trunk-x86_64-pc-windows-msvc.zip
            trunk_extract: zip
          - os: macos-latest
            platform: mac
            trunk_asset: trunk-aarch64-apple-darwin.tar.gz
            trunk_extract: tar
          - os: ubuntu-latest
            platform: linux
            trunk_asset: trunk-x86_64-unknown-linux-gnu.tar.gz
            trunk_extract: tar

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: portfolio-desktop-${{ matrix.platform }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk (prebuilt)
        shell: bash
        env:
          NO_COLOR: false
        run: |
          set -e
          BASE="https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}"
          URL="${BASE}/${{ matrix.trunk_asset }}"
          if [ "${{ matrix.trunk_extract }}" = "zip" ]; then
            curl -sSL "$URL" -o trunk.zip
            unzip -q trunk.zip
          else
            curl -sSL "$URL" | tar xz
          fi
          mkdir -p "$HOME/.local/bin"
          if [ -f trunk.exe ]; then
            mv trunk.exe "$HOME/.local/bin/trunk.exe"
          else
            mv trunk "$HOME/.local/bin/trunk"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          trunk --version

      - name: Install wasm-bindgen-cli
        shell: bash
        run: |
          set -e
          export PATH="$HOME/.cargo/bin:$PATH"
          if [ -x "$HOME/.cargo/bin/wasm-bindgen" ]; then
            wasm-bindgen --version
            exit 0
          fi
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo binstall wasm-bindgen-cli --version "${WASM_BINDGEN_CLI_VERSION}" --no-confirm \
            || cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_CLI_VERSION}" --locked
          wasm-bindgen --version

      - name: Install Linux packaging tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Compile Electron backend (TypeScript)
        run: npm run build:electron

      - name: Build desktop installers
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            npm run make:linux-test
          else
            npm run make
          fi
        env:
          CI: true
          NO_COLOR: false

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: out/make/**/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release-assets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
