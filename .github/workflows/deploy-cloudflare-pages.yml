# Build Yew/Trunk WASM and deploy to Cloudflare Pages (free).
# Add GitHub secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#
# If the live site stays stale: (1) Actions → this workflow → confirm last run is green.
# (2) Cloudflare Pages → project → Settings → Builds: if Git integration is also building
# this repo, disable it or align the build command so Actions remains the single deploy path.

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "portfolio"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Match GitHub Pages workflow: trunk + wasm-bindgen-cli (required for WASM bindgen step).
      - name: Install Trunk and wasm-bindgen-cli
        run: cargo install trunk wasm-bindgen-cli

      - name: Build
        run: trunk build --release --public-url /

      - name: Verify dist output
        run: test -f dist/index.html && ls -la dist/

      - name: Create Pages project (if not exists)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages project create azuree0-portfolio --production-branch main || true

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=azuree0-portfolio
