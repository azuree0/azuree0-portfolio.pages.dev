# Build Yew/Trunk WASM and deploy to Cloudflare Pages (free).
# Add GitHub secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#
# Fast CI: prebuilt Trunk binary + cargo-binstall for wasm-bindgen-cli (matches Cargo.lock 0.2.x).
# If the live site stays stale: (1) Actions → this workflow → confirm last run is green.
# (2) Cloudflare Pages → Settings → Builds: avoid duplicate Git builds overwriting Actions deploy.

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# New pushes cancel an in-flight deploy so the latest commit runs (no queue behind slow jobs).
concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: true

# Pin with Cargo.lock wasm-bindgen version (update when lockfile changes).
env:
  WASM_BINDGEN_CLI_VERSION: "0.2.108"
  TRUNK_VERSION: "0.21.14"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "portfolio"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache ~/.cargo/bin (wasm-bindgen-cli)
        uses: actions/cache@v4
        id: cache-cargo-bin
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-cargo-bin-wasm-bindgen-${{ env.WASM_BINDGEN_CLI_VERSION }}-v2

      - name: Install Trunk (prebuilt)
        run: |
          set -e
          curl -sSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv trunk /usr/local/bin/
          trunk --version

      - name: Install wasm-bindgen-cli (cargo-binstall or cache)
        run: |
          set -e
          export PATH="$HOME/.cargo/bin:$PATH"
          if [ -x "$HOME/.cargo/bin/wasm-bindgen" ]; then
            echo "Using cached wasm-bindgen-cli"
            wasm-bindgen --version
            exit 0
          fi
          curl -L --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo binstall wasm-bindgen-cli --version "${WASM_BINDGEN_CLI_VERSION}" --no-confirm \
            || cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_CLI_VERSION}" --locked
          wasm-bindgen --version

      - name: Build
        run: trunk build --release --public-url /

      - name: Verify dist output
        run: test -f dist/index.html && ls -la dist/

      # Compare with https://azuree0-portfolio.pages.dev/version.txt after deploy (must match this run’s SHA).
      - name: Write deploy stamp to dist
        run: |
          echo "${{ github.sha }}" > dist/version.txt
          echo "$(date -u -Iseconds)" >> dist/version.txt

      - name: Create Pages project (if not exists)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages project create azuree0-portfolio --production-branch main || true

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=azuree0-portfolio
